<div class="prog-bar-wrap">
  <div class="prog-bar">
    <div
      class="prog-bar__fill"
      [attr.data-level]="level"
      [style.width.%]="percentage">
    </div>
  </div>
  @if (showLabel && showPercentage) {
    <span class="prog-bar__label">{{ percentage | number:'1.0-0' }}%</span>
  }
</div>
