<div class="kpi-card flex h-full flex-col rounded-xl p-5 shadow-sm transition-shadow duration-300 hover:shadow-md" [ngClass]="styles.container">
  <div class="flex items-start justify-between gap-3">
    <p class="pt-1 text-[10px] font-bold uppercase tracking-widest opacity-80">{{ label }}</p>
    @if (icon) {
      <!-- El centrado vive en el contenedor: la hoja de Material Symbols fija `display` en su clase y anula `flex`. -->
      <span class="kpi-icon flex h-9 w-9 shrink-0 items-center justify-center rounded-lg" [ngClass]="styles.icon" aria-hidden="true">
        <span class="material-symbols-outlined text-xl leading-none">{{ icon }}</span>
      </span>
    }
  </div>

  <p class="mt-1 text-2xl font-black leading-tight tabular-nums">{{ value }}</p>
  @if (subtitle) {
    <p class="mt-1 text-sm opacity-80">{{ subtitle }}</p>
  }

  @if (trendValue || showProgress) {
    <div class="mt-auto flex items-center gap-2 pt-4">
      @if (showProgress) {
        <div class="h-1.5 w-full overflow-hidden rounded-full" [ngClass]="styles.track"
             role="progressbar" [attr.aria-valuenow]="progressWidth" aria-valuemin="0" aria-valuemax="100" [attr.aria-label]="label">
          <div class="h-full rounded-full transition-all duration-500" [ngClass]="styles.progress" [style.width.%]="progressWidth"></div>
        </div>
      }
      @if (trendValue) {
        <div class="flex shrink-0 items-center gap-1" [ngClass]="trendColorClasses">
          <span class="material-symbols-outlined text-base" aria-hidden="true">{{ trendIcon }}</span>
          <span class="text-[10px] font-bold">{{ trendValue }}</span>
          @if (trendLabel) {
            <span class="text-[10px] opacity-80">{{ trendLabel }}</span>
          }
        </div>
      }
    </div>
  }
</div>
