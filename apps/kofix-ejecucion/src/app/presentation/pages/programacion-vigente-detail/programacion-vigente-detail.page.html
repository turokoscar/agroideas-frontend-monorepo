@if (convenio(); as c) {
  <div class="px-6 py-8 animate-fade-in font-display w-full max-w-full overflow-hidden block">
    <div class="flex flex-col md:flex-row items-start justify-between mb-8 gap-6">
      <div class="flex gap-4 w-full md:w-auto">
        <ui-button
          severity="subtle"
          iconOnly
          icon="arrow_back"
          ariaLabel="Volver"
          (onClick)="goBack()">
        </ui-button>
        <div class="flex-1 min-w-0">
          <h2 class="text-xl md:text-2xl font-black uppercase tracking-tight text-slate-900 dark:text-white max-w-3xl leading-tight truncate">
            {{ c.razonSocial }}
          </h2>
          <div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-slate-500 dark:text-slate-400">
            <span class="text-xs md:text-sm font-semibold tracking-wide">{{ formatConvenioNumber() }}</span>
            <span class="hidden md:block h-1 w-1 rounded-full bg-slate-300 dark:bg-slate-600"></span>
            <span class="text-xs md:text-sm font-medium uppercase">Programación</span>
          </div>
        </div>
      </div>
    </div>

    <app-programacion-items
      [convenioId]="c.id"
      [fechaInicio]="c.fechaInicio"
      [fechaFin]="c.fechaFin"
      [readOnly]="false">
    </app-programacion-items>
  </div>
}
