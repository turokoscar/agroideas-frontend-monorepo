<div class="flex h-screen bg-slate-50 overflow-hidden font-display">
    <app-sidebar [isOpen]="isSidebarOpen" [menuItems]="menuItems" [statusSummary]="statusSummary"></app-sidebar>
    
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <app-dashboard-header 
            [user]="user()"
            (onToggleSidebar)="toggleSidebar()"
            (onLogout)="logout()"
        ></app-dashboard-header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar relative">
            <div class="max-w-[1600px] mx-auto">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>
</div>
