<div class="p-6 space-y-6">

  <!-- Page Header -->
  <div>
    <h1 class="text-2xl font-bold text-slate-800">Ejecución</h1>
    <p class="text-sm text-slate-500 mt-1">Convenios con programación completa, listos para gestión financiera</p>
  </div>

  <!-- Filtros -->
  <app-ui-filter-bar (onSearch)="onSearch()" [showAdd]="false">
    <div class="filter-group filter-group--search">
      <label class="filter-label" for="ejecucion-search">Buscar</label>
      <div class="filter-search-wrap">
        <span class="material-symbols-outlined filter-search-icon">search</span>
        <input id="ejecucion-search" type="text"
          class="filter-input filter-input--search"
          placeholder="Organización o N° convenio..."
          [(ngModel)]="search"
          (keyup.enter)="onSearch()" />
      </div>
    </div>

    <div class="filter-group">
      <label class="filter-label" for="ejecucion-estado">Estado</label>
      <select id="ejecucion-estado" class="filter-input" [(ngModel)]="estadoFilter" (change)="onSearch()">
        <option value="">Todos los estados</option>
        <option value="VIGENTE">Activo</option>
        <option value="FINALIZADO">Finalizado</option>
      </select>
    </div>
  </app-ui-filter-bar>

  <!-- Table -->
  <app-ui-data-table
    [data]="convenios()"
    [columns]="columns"
    [loading]="loading()"
    [totalRecords]="totalRecords()"
    [rows]="pageSize()"
    [rowsOptions]="rowsOptions"
    [paginator]="true"
    [lazy]="true"
    [hasActions]="true"
    [showIndex]="true"
    [actionsTemplate]="ejecucionActions"
    [rowTemplate]="rowTemplate"
    title="Convenios en Ejecución"
    subtitle="No Objeción, Desembolsos, Rendiciones y Kardex"
    icon="account_balance_wallet"
    emptyIcon="account_balance_wallet"
    emptyMessage="No se encontraron convenios en ejecución"
    emptySubMessage="Intenta ajustar los filtros de búsqueda"
    (onLazyLoad)="loadData($event)"
    (rowsChange)="onRowsChange($event)">

    <ng-template #rowTemplate let-row let-col="col">
      @if (col.field === 'razonSocial') {
        <div class="cell-org">
          <span class="cell-org__name">{{ row.razonSocial }}</span>
          <span class="cell-org__ruc">RUC: {{ row.ruc }}</span>
        </div>
      }
      @if (col.field === 'estado') {
        <app-ui-status-pill [status]="getStatusType(row)" [text]="getStatusLabel(row)"></app-ui-status-pill>
      }
      @if (col.field === 'montoEjecutado') {
        <div class="cell-ejecucion">
          <app-ui-progress-bar
            [value]="row.montoEjecutado"
            [maxValue]="row.montoAprobado"
            [showLabel]="true">
          </app-ui-progress-bar>
        </div>
      }
    </ng-template>
  </app-ui-data-table>
</div>

<!-- Template de acciones por fila -->
<ng-template #ejecucionActions let-row>
  <div class="row-actions">
    <ui-button iconOnly appearance="soft" severity="primary" size="sm" icon="account_balance_wallet"
      ariaLabel="Gestionar Ejecución" (onClick)="gestionarEjecucion(row)" />
    <ui-button iconOnly appearance="soft" severity="secondary" size="sm" icon="receipt_long"
      ariaLabel="Descargar Kardex resumen" (onClick)="exportService.exportKardexConsolidado(row.id, formatConvenioNumber(row))" />
  </div>
</ng-template>
