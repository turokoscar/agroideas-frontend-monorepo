<div class="page-container">
    <ui-page-header title="Reportes" subtitle="Genere reportes consolidados de la ejecución de convenios" />

    <app-ui-filter-bar [showSearch]="false">
        <div class="filter-group filter-group--reporte">
            <label class="filter-label" for="reportes-tipo">Tipo de Reporte</label>
            <select
                id="reportes-tipo"
                class="filter-input"
                [(ngModel)]="selectedReporteValue"
                (ngModelChange)="onReporteChange($event)">
                <option [ngValue]="null">Seleccione un reporte</option>
                @for (opt of reporteOptions; track opt.value) {
                    <option [value]="opt.value">{{ opt.label }}</option>
                }
            </select>
        </div>
        <div class="filter-group">
            <label class="filter-label" for="reportes-fecha-inicio">Fecha Inicio</label>
            <input
                id="reportes-fecha-inicio"
                type="date"
                class="filter-input"
                [(ngModel)]="fechaInicio">
        </div>
        <div class="filter-group">
            <label class="filter-label" for="reportes-fecha-fin">Fecha Fin</label>
            <input
                id="reportes-fecha-fin"
                type="date"
                class="filter-input"
                [(ngModel)]="fechaFin">
        </div>
        <div class="reporte-acciones">
            <ui-button
                severity="primary"
                icon="file_open"
                label="Generar Reporte"
                [loading]="loading()"
                [disabled]="!selectedReporteValue"
                (onClick)="generarReporte()">
            </ui-button>
            <ui-button
                severity="success"
                icon="description"
                label="Excel"
                [loading]="exportando() === 'excel'"
                [disabled]="!puedeExportar()"
                (onClick)="exportarExcel()">
            </ui-button>
            <ui-button
                severity="danger"
                icon="picture_as_pdf"
                label="PDF"
                [loading]="exportando() === 'pdf'"
                [disabled]="!puedeExportar()"
                (onClick)="exportarPdf()">
            </ui-button>
        </div>
    </app-ui-filter-bar>

    <ui-card [title]="selectedReporte()?.label || 'Vista Previa'" [icon]="selectedReporte()?.icon || 'preview'">
        @if (esAvanceMensual()) {
            @if (loading()) {
                <ui-state kind="loading" message="Generando el reporte…" />
            } @else if (error()) {
                <ui-state kind="error" [message]="error()!" retryLabel="Reintentar" (retry)="generarReporte()" />
            } @else if (reporteAvance()) {
                @if (reporteAvance()!.filas.length) {
                    <app-avance-mensual-table [reporte]="reporteAvance()!" />
                } @else {
                    <ui-state kind="empty" icon="grid_view" message="No hay programación ni ejecución en el periodo para sus convenios." />
                }
            } @else {
                <ui-state kind="empty" icon="date_range" message="Elija el periodo y presione Generar Reporte."
                    [detail]="selectedReporte()?.description ?? ''" />
            }
        } @else if (selectedReporte()) {
            <ui-state kind="empty" icon="preview" message="Vista previa del reporte" [detail]="selectedReporte()?.description ?? ''"></ui-state>
        } @else {
            <ui-state kind="empty" icon="folder_open" message="Seleccione un tipo de reporte" [detail]="'Use la barra superior para elegir un reporte'"></ui-state>
        }
    </ui-card>
</div>
