@if (stateService.convenio(); as convenio) {
  <div class="px-6 py-8 animate-fade-in font-display w-full max-w-full overflow-hidden block">
    <!-- Navigation & Title -->
    <div class="flex flex-col md:flex-row items-start justify-between mb-8 gap-6">
      <div class="flex gap-4 w-full md:w-auto">
        <ui-button
          severity="subtle"
          iconOnly
          icon="arrow_back"
          ariaLabel="Volver"
          (onClick)="goBack()">
        </ui-button>
        <div class="flex-1 min-w-0">
          <h2
            class="text-xl md:text-2xl font-black uppercase tracking-tight text-slate-900 dark:text-white max-w-3xl leading-tight truncate">
            {{ convenio.razonSocial }}
          </h2>
          <div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-slate-500 dark:text-slate-400">
            <span class="text-xs md:text-sm font-semibold tracking-wide">{{ formatConvenioNumber(convenio) }}</span>
            <span class="hidden md:block h-1 w-1 rounded-full bg-slate-300 dark:bg-slate-600"></span>
            <span class="text-[10px] md:text-sm font-medium uppercase">EJECUCIÓN FINANCIERA</span>
          </div>
        </div>
      </div>
    </div>
    <!-- KPI Cards -->
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4 mb-8">
      <app-ui-kpi
        label="MONTO APROBADO"
        [value]="formatCurrency(stateService.convenio()!.montoAprobado)"
        icon="trending_up"
        variant="primary"
        subtitle="100% Financiado">
      </app-ui-kpi>

      <app-ui-kpi
        label="PROGRAMADO ACUMULADO"
        [value]="formatCurrency(stateService.convenio()!.programacionAcumulada) || 'S/ 0.00'"
        icon="calendar_month"
        variant="info"
        [subtitle]="(stateService.porcentajeProgramacion() | number:'1.0-0') + '% del aprobado'">
      </app-ui-kpi>

      <app-ui-kpi
        label="EJECUTADO ACUMULADO"
        [value]="formatCurrency(stateService.convenio()!.ejecucionAcumulada) || 'S/ 0.00'"
        icon="payments"
        variant="success"
        [subtitle]="(stateService.porcentajeEjecucion() | number:'1.0-0') + '% de avance'">
      </app-ui-kpi>

      <app-ui-kpi
        label="SALDO DISPONIBLE"
        [value]="formatCurrency(stateService.saldoDisponible())"
        icon="account_balance_wallet"
        variant="warning"
        [subtitle]="((stateService.saldoDisponible() / (stateService.convenio()!.programacionAcumulada || 1) * 100) | number:'1.0-0') + '% disponible'">
      </app-ui-kpi>
    </div>
    <!-- Detailed Sections (Tabs) -->
    <div
      class="bg-white dark:bg-zinc-900 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm overflow-hidden">
      <app-convenio-detail-tabs
        [tabs]="tabs"
        [activeIndex]="activeTabIndex()"
        (tabChange)="setActiveTab($event)">
      </app-convenio-detail-tabs>
      <!-- Tab Content -->
      <div class="p-8">
        @if (activeTabIndex() === 0) {
          <div>
            <app-no-objecion-page [convenioId]="convenio.id" [readOnly]="false"></app-no-objecion-page>
          </div>
        }
        @if (activeTabIndex() === 1) {
          <div>
            <app-desembolso-page [convenioId]="convenio.id" [readOnly]="false"></app-desembolso-page>
          </div>
        }
        @if (activeTabIndex() === 2) {
          <div>
            <app-rendicion-page [convenioId]="convenio.id" [readOnly]="false"></app-rendicion-page>
          </div>
        }
        @if (activeTabIndex() === 3) {
          <app-kardex-varianza-tab
            [convenio]="convenio"
            [kardexConsolidado]="kardexConsolidado()"
            [loadingKardex]="loadingKardex()">
          </app-kardex-varianza-tab>
        }
      </div>
    </div>
  </div>
}
