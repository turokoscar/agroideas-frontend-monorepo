<div class="p-6 md:p-8 space-y-8 animate-fade-in font-display w-full max-w-full overflow-hidden block">
    <header class="border-b border-slate-200 dark:border-zinc-800 pb-5">
        <h1 class="text-2xl font-black uppercase text-slate-800 dark:text-white tracking-tight leading-tight">Resumen Ejecutivo</h1>
        <p class="text-slate-500 text-sm mt-1">Estado de ejecución presupuestal y convenios vigentes en el sistema.</p>
    </header>

    <!-- Loading Resumen -->
    <div *ngIf="loadingResumen()" class="flex flex-col items-center justify-center py-10 space-y-4">
        <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary"></div>
        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Cargando métricas...</span>
    </div>

    <!-- Executive Summary Dashboard (Tiles) -->
    <div *ngIf="!loadingResumen() && resumenData()">
        <app-resumen-ejecutivo [data]="resumenData()"></app-resumen-ejecutivo>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 pt-4">
        <!-- 8 Columns Chart -->
        <div class="lg:col-span-8 w-full max-w-full overflow-hidden block">
            <!-- SVG Line Chart Component (siempre montado) -->
            <div class="relative">
                @if (loadingChart()) {
                    <div class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-white/80 dark:bg-zinc-900/80 rounded-2xl space-y-4">
                        <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary"></div>
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Cargando datos del gráfico...</span>
                    </div>
                }
                <app-reporte-mensual-chart 
                    [data]="chartData()" 
                    [selectedYear]="selectedYear()"
                    (onYearChange)="onYearChange($event)">
                </app-reporte-mensual-chart>
            </div>
        </div>

        <!-- 4 Columns Donut Chart -->
        <div class="lg:col-span-4 flex flex-col gap-6">
            @if (!loadingChart()) {
                <app-reporte-mensual-donut
                    [data]="donutData()"
                    [year]="selectedYear()"
                    (onYearChange)="onYearChange($event)">
                </app-reporte-mensual-donut>
            } @else {
                <div class="flex flex-col items-center justify-center py-10 space-y-4 bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-2xl min-h-[250px]">
                    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary"></div>
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Cargando dona...</span>
                </div>
            }
        </div>
    </div>
</div>
