<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
  <!-- Card 1: Convenios Activos -->
  <app-ui-kpi
    label="Convenios Activos"
    [value]="data().conveniosActivos + ' de ' + data().totalConvenios + ' convenios'"
    subtitle="Vigentes en el año fiscal"
    variant="primary"
    icon="handshake"
    [showProgress]="data().totalConvenios > 0"
    [progress]="getProgressPercent(data().conveniosActivos, data().totalConvenios)">
  </app-ui-kpi>

  <!-- Card 2: Programación Acumulada -->
  <app-ui-kpi
    label="Programación Acumulada"
    [value]="formatCurrency(data().programacionAcumulada)"
    subtitle="Multianual (hasta 36 meses)"
    variant="info"
    icon="calendar_month">
  </app-ui-kpi>

  <!-- Card 3: Ejecución Acumulada -->
  <app-ui-kpi
    label="Ejecución Acumulada"
    [value]="formatCurrency(data().ejecucionAcumulada)"
    [subtitle]="getPercent(data().ejecucionAcumulada, data().programacionAcumulada) + ' del programado'"
    variant="success"
    icon="payments"
    [showProgress]="data().programacionAcumulada > 0"
    [progress]="getProgressPercent(data().ejecucionAcumulada, data().programacionAcumulada)">
  </app-ui-kpi>

  <!-- Card 4: Saldo Disponible -->
  <app-ui-kpi
    label="Saldo Disponible"
    [value]="formatCurrency(data().saldoDisponible)"
    [subtitle]="getPercent(data().saldoDisponible, data().programacionAcumulada) + ' por ejecutar'"
    variant="warning"
    icon="account_balance_wallet"
    [showProgress]="data().programacionAcumulada > 0"
    [progress]="getProgressPercent(data().saldoDisponible, data().programacionAcumulada)">
  </app-ui-kpi>
</div>
