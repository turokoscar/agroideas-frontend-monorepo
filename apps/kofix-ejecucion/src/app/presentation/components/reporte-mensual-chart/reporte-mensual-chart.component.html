<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm md:p-6 dark:border-zinc-800 dark:bg-zinc-900">
  <div class="mb-4">
    <h3 class="text-base font-extrabold uppercase tracking-wide text-slate-900 dark:text-zinc-100">Desempeño Financiero Mensual</h3>
    <span class="mt-0.5 block text-xs text-slate-500">Programado vs ejecución efectivizada · Año {{ selectedYear() }}</span>
  </div>

  <app-ui-chart
    type="line"
    valueFormat="currency"
    height="320px"
    [labels]="monthsNames"
    [datasets]="datasets()"
    [ariaLabel]="'Programado vs ejecutado por mes, año ' + selectedYear()">
  </app-ui-chart>
</div>
