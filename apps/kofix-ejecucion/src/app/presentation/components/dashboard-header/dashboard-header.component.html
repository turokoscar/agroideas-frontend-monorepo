<header class="bg-white border-b border-slate-100 h-20 flex items-center justify-between px-6 sticky top-0 z-40 shadow-sm">
    <div class="flex items-center gap-4">
        <ui-button severity="subtle" iconOnly icon="menu"
            ariaLabel="Menú" (onClick)="onToggleSidebar.emit()" />
        <div class="hidden md:flex items-center gap-3 ml-2">
            <h2 class="text-2xl font-black text-primary tracking-tighter">KOFIX</h2>
            <div class="h-6 w-[1px] bg-slate-200"></div>
            <div class="flex flex-col">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest leading-none">Sistema de Control</p>
                <p class="text-[10px] font-medium text-slate-500 uppercase tracking-tighter mt-1">Agroideas</p>
            </div>
        </div>
    </div>

    <div class="flex items-center gap-6">
        <div class="hidden lg:flex items-center gap-4 px-4 py-2 bg-slate-50 rounded-2xl border border-slate-100">
            <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center border-2 border-white shadow-sm">
                <span class="material-symbols-outlined text-primary text-xl">person</span>
            </div>
            <div class="text-left">
                <p class="text-sm font-black text-slate-900 leading-none mb-0.5">{{ user?.name }}</p>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">{{ user?.role }}</p>
            </div>
        </div>

        <div class="h-8 w-[1px] bg-slate-200"></div>

        <ui-button severity="danger" appearance="soft" icon="logout" label="Salir"
            (onClick)="onLogout.emit()" />
    </div>
</header>
