<button
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick.emit($event)"
  [ngClass]="getClasses()"
  class="flex items-center justify-center gap-2 rounded-xl px-6 py-3 text-sm font-bold transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
>
  <span *ngIf="loading" class="animate-spin material-symbols-outlined text-lg">progress_activity</span>
  <span *ngIf="icon && !loading" class="material-symbols-outlined text-xl">{{ icon }}</span>
  <ng-content *ngIf="!loading"></ng-content>
  <span *ngIf="loading">Cargando...</span>
</button>
