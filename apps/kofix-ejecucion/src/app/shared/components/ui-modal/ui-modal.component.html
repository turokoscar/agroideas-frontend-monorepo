<p-dialog 
    [(visible)]="visible" 
    [modal]="true" 
    [closable]="!isSubmitting" 
    (onHide)="onHide.emit()"
    [style]="{ width: '100%', maxWidth: maxWidth, border: 'none', maxHeight: '95vh' }" 
    [showHeader]="false"
    [contentStyle]="{ 'padding': '0', 'border-radius': '2rem', 'overflow': 'hidden', 'box-shadow': '0 25px 50px -12px rgba(0, 0, 0, 0.15)', 'display': 'flex', 'flex-direction': 'column', 'max-height': '95vh' }"
    class="ui-modal"
>
    <!-- Loading State Overlay -->
    <div *ngIf="isLoading" class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm">
        <div class="relative w-16 h-16 mb-6">
            <div class="absolute inset-0 border-4 border-primary/10 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
        </div>
        <p class="text-slate-500 font-bold tracking-widest uppercase text-[10px] animate-pulse">Procesando información...</p>
    </div>

    <div class="bg-white dark:bg-slate-900 flex flex-col font-display h-full overflow-hidden">
        <!-- Header -->
        <div class="px-4 md:px-8 py-4 md:py-6 border-b border-slate-100 dark:border-white/5 flex justify-between items-center bg-slate-50/30 shrink-0">
            <div class="flex items-center gap-3 md:gap-4">
                <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary border border-primary/20 shadow-sm shadow-primary/5">
                    <span class="material-symbols-outlined text-xl md:text-2xl font-black">{{ icon }}</span>
                </div>
                <div>
                    <h3 class="text-lg md:text-xl font-black text-slate-800 dark:text-slate-100 tracking-tight leading-none mb-1">
                        {{ title }}
                    </h3>
                    <p *ngIf="subtitle" class="text-[9px] md:text-[10px] text-slate-400 font-bold uppercase tracking-widest flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-primary/40"></span>
                        {{ subtitle }}
                    </p>
                </div>
            </div>
            <button (click)="onHide.emit()" [disabled]="isSubmitting"
                class="w-10 h-10 flex items-center justify-center rounded-full text-slate-300 hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-800 transition-all duration-200 active:scale-95 disabled:opacity-30">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- Body -->
        <div class="p-4 md:p-8 flex-1 overflow-y-auto">
            <ng-content></ng-content>
        </div>

        <!-- Footer -->
        <div class="px-4 md:px-10 py-6 md:py-8 border-t border-slate-100 dark:border-white/5 flex flex-col md:flex-row justify-between items-center gap-6 bg-slate-50/40 backdrop-blur-md shrink-0">
            <div class="flex-1 flex items-center justify-center md:justify-start w-full">
                <ng-content select="[footer-start]"></ng-content>
            </div>
            
            <div class="flex items-center gap-4 w-full md:w-auto justify-end">
                <app-ui-button 
                    variant="secondary" 
                    [icon]="cancelIcon"
                    (onClick)="onHide.emit()"
                    [disabled]="isSubmitting"
                >
                    {{ cancelLabel }}
                </app-ui-button>
                
                <ng-content select="[footer-actions]"></ng-content>

                <app-ui-button 
                    *ngIf="showSaveButton"
                    variant="primary" 
                    [icon]="saveIcon"
                    [loading]="isSubmitting"
                    [disabled]="saveDisabled"
                    (onClick)="onSave.emit()"
                >
                    {{ saveLabel }}
                </app-ui-button>
            </div>
        </div>
    </div>
</p-dialog>
