<div class="kpi-card rounded-xl p-6 transition-all duration-300"
     [ngClass]="getContainerClasses()"
     [style.background-color]="backgroundColor"
     [style.border-left]="borderLeft">
  <div class="flex flex-col gap-1" [style.color]="textColor">
    <p class="text-[10px] font-bold uppercase tracking-widest opacity-80">{{ label }}</p>
    <h3 class="text-2xl font-black">{{ value }}</h3>
    @if (subtitle) {
      <p class="text-sm opacity-80">{{ subtitle }}</p>
    }
  </div>

  @if (trendValue || showProgress) {
    <div class="mt-4 flex items-center gap-2">
      @if (showProgress) {
        <div class="h-1.5 w-full rounded-full bg-black/10 dark:bg-white/10 overflow-hidden">
          <div class="h-full rounded-full transition-all duration-500" [ngClass]="getProgressClasses()" [style.width]="progress + '%'"></div>
        </div>
      }
      @if (trendValue) {
        <div class="flex items-center gap-1" [ngClass]="trendColorClasses">
          <span class="material-symbols-outlined text-base">{{ trendIcon }}</span>
          <span class="text-[10px] font-bold">{{ trendValue }}</span>
        </div>
      }
    </div>
  }
</div>
