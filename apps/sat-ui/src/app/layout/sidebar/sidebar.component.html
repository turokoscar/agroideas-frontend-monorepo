<aside class="flex h-screen w-64 flex-col bg-sidebar text-sidebar-foreground">
  <div class="flex items-center gap-3 px-5 py-6 border-b border-sidebar-border">
    <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-sidebar-primary">
      <span class="material-symbols-outlined text-sidebar-primary-foreground">eco</span>
    </div>
    <div>
      <p class="text-sm font-bold font-display tracking-wide uppercase">Yachachiq</p>
      <p class="text-[10px] opacity-70">AGROIDEAS · MIDAGRI</p>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
    @for (link of links(); track link.to) {
      <a
        [routerLink]="link.to"
        routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground font-medium"
        [routerLinkActiveOptions]="{exact: true}"
        class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm transition-colors text-sidebar-foreground/70 hover:bg-sidebar-accent/50 hover:text-sidebar-foreground"
      >
        <span class="material-symbols-outlined text-[18px]">{{ link.icon }}</span>
        {{ link.label }}
      </a>
    }
  </nav>

  <div class="border-t border-sidebar-border px-4 py-4">
    <div class="mb-3 text-xs opacity-60">
      {{ user()?.nombre }}
    </div>
    <button
      (click)="logout()"
      class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm text-sidebar-foreground/70 hover:bg-sidebar-accent/50 transition-colors"
    >
      <span class="material-symbols-outlined text-[18px]">logout</span>
      Cerrar sesión
    </button>
  </div>
</aside>
