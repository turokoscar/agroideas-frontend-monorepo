<div class="p-6 lg:p-8 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="font-display text-2xl font-bold text-foreground">Gestión de Asignaciones</h1>
      <p class="text-sm text-muted-foreground">Asigne organizaciones a asistentes técnicos</p>
    </div>
    <ui-button label="Nueva Asignación" icon="add" (onClick)="openModal()"></ui-button>
  </div>

  <app-ui-data-table
    [data]="processedData()"
    [columns]="columns"
    [loading]="loading()"
    [hasActions]="true"
    icon="assignment"
    title="Listado de Asignaciones"
    subtitle="Vinculación de asistentes con organizaciones"
    emptyIcon="assignment_late"
    emptyMessage="No hay asignaciones registradas"
    emptySubMessage="Cree una nueva asignación usando el botón superior"
    [rowTemplate]="rowTemplate"
    [actionsTemplate]="rowActions">

    <ng-template #rowTemplate let-row let-col="col">
      @if (col.field === 'estado') {
        <app-ui-status-pill [status]="row.estadoValor" [text]="row.estadoText" />
      }
    </ng-template>

  </app-ui-data-table>
</div>

<ng-template #rowActions let-row>
  <div class="flex items-center gap-1">
    <ui-button iconOnly appearance="soft" severity="accent" size="sm" icon="edit"
      ariaLabel="Editar" (onClick)="$event.stopPropagation(); openModal(row)" />
    <ui-button iconOnly appearance="soft" severity="warning" size="sm" [icon]="row.flgActivo ? 'block' : 'check_circle'"
      [attr.ariaLabel]="row.flgActivo ? 'Desactivar' : 'Activar'"
      (onClick)="$event.stopPropagation(); toggleEstado(row)" />
    <ui-button iconOnly appearance="soft" severity="danger" size="sm" icon="delete"
      ariaLabel="Eliminar" (onClick)="$event.stopPropagation(); delete(row.ideAsignacion)" />
  </div>
</ng-template>

<!-- Modal -->
<app-ui-modal
  [visible]="showModal()"
  [title]="editingId() ? 'Editar Asignación' : 'Nueva Asignación'"
  subtitle="Vincule organizaciones con asistentes técnicos del monorepo"
  icon="assignment"
  maxWidth="550px"
  saveLabel="Guardar"
  (onHide)="closeModal()"
  (onSave)="save()"
>
  <div [formGroup]="asignacionForm" class="space-y-4 font-display">
    <div>
      <label for="ideAsistente" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Asistente Técnico</label>
      <select id="ideAsistente" formControlName="ideAsistente" class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-white text-sm outline-none focus:border-primary">
        <option value="">Seleccionar asistente</option>
        @for (a of asistentes(); track a.ideAsistente) {
          <option [value]="a.ideAsistente">{{ a.txtNombres }} {{ a.txtApellidoPaterno }}</option>
        }
      </select>
    </div>

    <div>
      <label for="ideOrganizacion" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Organización</label>
      <lib-ui-select-search
        id="ideOrganizacion"
        formControlName="ideOrganizacion"
        [options]="organizaciones()"
        optionLabel="txtNombreCompleto"
        optionValue="ideOrganizacion"
        placeholder="Buscar y seleccionar organización"
        filterPlaceholder="RUC, razón social o número de convenio"
        [emptyMessage]="mensajeListaVacia()"
        [loading]="loadingOrganizaciones()"
        (filterChange)="onFilterOrganizaciones($event)"
      >
      </lib-ui-select-search>
      @if (asignacionForm.get('ideOrganizacion')?.invalid && asignacionForm.get('ideOrganizacion')?.touched) {
        <p class="text-xs text-red-500 mt-1">Seleccione una organización</p>
      }
    </div>
  </div>
</app-ui-modal>
