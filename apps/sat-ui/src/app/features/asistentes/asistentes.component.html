<div class="p-6 lg:p-8 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="font-display text-2xl font-bold text-foreground">Gestión de Asistentes Técnicos</h1>
      <p class="text-sm text-muted-foreground">Registre y administre el personal de campo temporal de AGROIDEAS</p>
    </div>
    <ui-button label="Nuevo Asistente" icon="person_add" (onClick)="openModal()"></ui-button>
  </div>

  <app-ui-data-table
    [data]="processedData()"
    [columns]="columns"
    [loading]="loading()"
    [hasActions]="true"
    icon="people"
    title="Listado de Asistentes"
    subtitle="Personal de campo registrado en el sistema"
    emptyIcon="group_off"
    emptyMessage="No hay asistentes técnicos registrados"
    emptySubMessage="Registre un nuevo asistente usando el botón superior"
    [rowTemplate]="rowTemplate"
    [actionsTemplate]="rowActions">

    <ng-template #rowTemplate let-row let-col="col">
      @if (col.field === 'estado') {
        <app-ui-status-pill [status]="row.estadoValor" [text]="row.estadoText" />
      } @else if (col.field === 'nombreCompleto') {
        <div>
          <div class="font-medium text-foreground">{{ row.nombreCompleto }}</div>
          <div class="text-[11px] text-muted-foreground uppercase tracking-wider font-mono">ID: {{ row.ideAsistente.substring(0, 8) }}...</div>
        </div>
      }
    </ng-template>

  </app-ui-data-table>
</div>

<ng-template #rowActions let-row>
  <div class="flex items-center gap-1">
    <ui-button iconOnly appearance="soft" severity="accent" size="sm" icon="edit"
      ariaLabel="Editar" [disabled]="!row.flgActivo" (onClick)="$event.stopPropagation(); openModal(row)" />
    <ui-button iconOnly appearance="soft" severity="warning" size="sm" [icon]="row.flgActivo ? 'block' : 'check_circle'"
      [attr.ariaLabel]="row.flgActivo ? 'Inhabilitar' : 'Habilitar'"
      [disabled]="!row.flgActivo"
      (onClick)="$event.stopPropagation(); toggleEstado(row)" />
  </div>
</ng-template>

<!-- Modal -->
<app-ui-modal
  [visible]="showModal()"
  [title]="editingId() ? 'Editar Asistente Técnico' : 'Registrar Nuevo Asistente'"
  subtitle="Gestione el personal temporal de campo de AGROIDEAS"
  icon="people"
  maxWidth="600px"
  saveLabel="Guardar"
  (onHide)="closeModal()"
  (onSave)="save()"
>
  <div class="space-y-4 font-display">
    <div class="grid grid-cols-3 gap-4">
      <div>
        <label for="txtNombres" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nombres</label>
        <input id="txtNombres" type="text" [(ngModel)]="form.txtNombres" placeholder="Nombres" class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-white text-sm outline-none focus:border-primary" />
      </div>
      <div>
        <label for="txtApellidoPaterno" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Ap. Paterno</label>
        <input id="txtApellidoPaterno" type="text" [(ngModel)]="form.txtApellidoPaterno" placeholder="Paterno" class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-white text-sm outline-none focus:border-primary" />
      </div>
      <div>
        <label for="txtApellidoMaterno" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Ap. Materno</label>
        <input id="txtApellidoMaterno" type="text" [(ngModel)]="form.txtApellidoMaterno" placeholder="Materno" class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-white text-sm outline-none focus:border-primary" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="codUsuario" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Usuario (Móvil)</label>
        <input id="codUsuario" type="text" [(ngModel)]="form.codUsuario" placeholder="usuario_campo" [disabled]="!!editingId()" class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-white text-sm outline-none focus:border-primary disabled:opacity-55" />
      </div>
      <div>
        <label for="txtPasswordHash" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Contraseña</label>
        <input id="txtPasswordHash" type="password" [(ngModel)]="form.txtPasswordHash" [placeholder]="editingId() ? 'Sin cambiar' : '••••••••'" class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-white text-sm outline-none focus:border-primary" />
      </div>
    </div>

    <div>
      <label for="txtCorreo" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Correo de Contacto</label>
      <input id="txtCorreo" type="email" [(ngModel)]="form.txtCorreo" placeholder="ejemplo@agroideas.gob.pe" class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-white text-sm outline-none focus:border-primary" />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="fecInicioVigencia" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Inicio de Vigencia</label>
        <input id="fecInicioVigencia" type="date" [(ngModel)]="form.fecInicioVigencia" class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-white text-sm outline-none focus:border-primary" />
      </div>
      <div>
        <label for="fecFinVigencia" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Fin de Vigencia</label>
        <input id="fecFinVigencia" type="date" [(ngModel)]="form.fecFinVigencia" class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-white text-sm outline-none focus:border-primary" />
      </div>
    </div>
  </div>
</app-ui-modal>
